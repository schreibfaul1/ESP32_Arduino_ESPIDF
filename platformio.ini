; PlatformIO Project Configuration File

[platformio]
description = ESP32 template for the audioI2S library
extra_configs = platformio_override.ini
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[common]
monitor_speed = 115200 ; 115200
upload_speed  = 921600 ; 1500000
monitor_filters = direct

build_flags =
    -D WIFI_SSID='"SSID"'                    ; Better set WiFi credentials in platformio_override.ini, e.g. "MyWiFi"
    -D WIFI_PASS='"PASSWORD"'                ; Better set WiFi password in platformio_override.ini, e.g. "MyPassword"
    -D CORE_DEBUG_LEVEL=3                                  ;0 None, 1 Error, 2 Warn, 3 Info, 4 Debug, 5 Verbose
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D ARDUINO_RUNNING_CORE=1                              ;Arduino Runs On Core (setup, loop)
    -D ARDUINO_EVENT_RUNNING_CORE=1                        ;Events Run On Core
    -D AUDIOTASK_CORE=0                                    ;0 or 1 - reads from the InBuffer, decodes and feeds I2S
    -D BOARD_HAS_PSRAM=1
    -D MONITOR_SPEED=${common.monitor_speed}
    -Wall
    -Wextra
    -Wno-cpp                                              ;Disable #warning directive warnings
    -Wno-format                                           ;Disable all format string warnings
    -Wno-unused-function
    -Wno-missing-field-initializers
    -fdiagnostics-color=always
    -Wno-error=class-memaccess
    -Wl,--print-memory-usage
    -Wl,-Map=.pio/build/esp32p4/firmware.map
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[env]

; Arduino 3.3.12 IDF 5.5.5
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip

; Arduino 4.0.0-RC1 IDF 6.1 (certificate error)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip

framework = arduino, espidf

monitor_speed   = ${common.monitor_speed}
upload_speed    = ${common.upload_speed}
monitor_filters = ${common.monitor_filters}

lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S#master
custom_component_remove =
                          espressif/network_provisioning
                          espressif/esp-zboss-lib
                          espressif/esp-zigbee-lib
                          espressif/esp_rainmaker
                          espressif/rmaker_common
                          espressif/esp_insights
                          espressif/esp_diag_data_store
                          espressif/esp_diagnostics
                          espressif/cbor
                          espressif/qrcode
                          espressif/esp-sr
                          espressif/libsodium
                          espressif/esp-modbus
                          ;chmorgan/esp-libhelix-mp3
                          espressif/esp32-camera

;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[env:esp32]
    board_build.partitions = boards/dev-4MB.csv    ; 4MB Flash
    ;board_build.partitions = boards/dev-8MB.csv    ; 8MB Flash
    ;board_build.partitions = boards/dev-16MB.csv   ; 16MB Flash

    board = ESP32-Dev-4MB            ; 4MB Flash
    ;board = ESP32-Dev-8MB            ; 8MB Flash
    ;board = ESP32-Dev-16MB           ;16MB Flash

    build_flags   = -mtext-section-literals
                    -Wl,-Map=.pio/build/esp32s3/firmware.map
                    ${common.build_flags}
    build_unflags = -D CONFIG_ESP_WIFI_REMOTE_ENABLED
    board_build.esp-idf.sdkconfig_path = sdkconfig.esp32
    board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig/esp32/sdkconfig.defaults;sdkconfig/esp32/sdkconfig.changes"
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[env:esp32s3]
    ;board_build.partitions = boards/dev-4MB.csv    ;  4MB Flash
    board_build.partitions = boards/dev-8MB.csv    ;  8MB Flash
    ;board_build.partitions = boards/dev-16MB.csv   ; 16MB Flash

    ;board = ESP32-S3-DevKitC-1-N8R2  ;  8 MB Flash, 2MB have quad PSRAM- --> must change in menuconfig
    board = ESP32-S3-DevKitC-1-N8R8  ;  8 MB Flash, 8MB octo PSRAM
    ;board = ESP32-S3-DevKitC-1-N16R8 ; 16 MB Flash, 8MB octo PSRAM

    build_flags   = -mtext-section-literals
                    -Wl,-Map=.pio/build/esp32s3/firmware.map
                    ${common.build_flags}
    build_unflags = -D CONFIG_ESP_WIFI_REMOTE_ENABLED
    board_build.esp-idf.sdkconfig_path = sdkconfig.esp32s3
    board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig/esp32s3/sdkconfig.defaults;sdkconfig/esp32s3/sdkconfig.changes"
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[env:esp32s31]
    board_build.partitions = boards/dev-16MB.csv   ; 16MB Flash
    ;board_build.partitions = boards/dev-32MB.csv   ; 32MB Flash

    board = ESP32-S31-Coreboard1 ;  16 MB Flash, 16MB octo PSRAM

    build_flags   = -mtext-section-literals
                    -Wl,-Map=.pio/build/esp32s31/firmware.map
                    ${common.build_flags}
    build_unflags = -D CONFIG_ESP_WIFI_REMOTE_ENABLED
    board_build.esp-idf.sdkconfig_path = sdkconfig.esp32s31
    board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig/esp32s31/sdkconfig.defaults;sdkconfig/esp32s31/sdkconfig.changes"
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[env:esp32p4_es]
    board_build.partitions = boards/miniwebradio16MB.csv  ;16MB Flash, OTA
    ;board_build.partitions = boards/miniwebradio32MB.csv  ;32MB Flash, OTA

    board = ESP32-P4-DevKitC-1-NRW16_es
    ;board = ESP32-P4-DevKitC-1-NRW32_es

    build_flags   = -Wl,-Map=.pio/build/esp32p4/firmware.map
                    ${common.build_flags}
    build_unflags = ; none
    board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig/esp32p4_es/sdkconfig.defaults;sdkconfig/esp32p4_es/sdkconfig.changes"
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————
[env:esp32p4]
    board_build.partitions = boards/miniwebradio32MB.csv   ;32MB Flash, OTA

    board = ESP32-P4-DevKitC-1-NRW32

    build_flags   = -Wl,-Map=.pio/build/esp32p4/firmware.map
                    ${common.build_flags}
    build_unflags = ; none
    board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig/esp32p4/sdkconfig.defaults;sdkconfig/esp32p4/sdkconfig.changes"
;—————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————————

